services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-astro
    networks:
      - web

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py seed_activities &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - data

  frontend-astro:
    build:
      context: ./frontend-astro
    command: sh -c "rm -rf .astro && pnpm astro preview stop || true && pnpm astro preview --host 0.0.0.0 --port 4321"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend-astro:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - web

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - data

volumes:
  frontend_node_modules:
  pgdata:

networks:
  web: {}
  data: {}